services:
  database:
    image: postgres:17-alpine
    container_name: miskila-database
    restart: unless-stopped
    env_file:
      - ./backend_miskila/.env
    ports:
      - '5433:5432'
    volumes:
      - miskila_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  miskila_postgres_data:
